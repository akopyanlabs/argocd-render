apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${name}
  annotations:
    argocd.argoproj.io/sync-wave: "${sync_wave}"
  labels:
    managed-by: argocd-render
    environment: ${stage}
    component: ${app_name}

spec:
  project: ${project}
  sources:
    - repoURL: ${repo_url}
      targetRevision: ${branch}
      path: ${chart_path}
      helm:
        releaseName: ${release_name}
        valueFiles: [${chart_values}, ${values_path}]
        ignoreMissingValueFiles: true
    - repoURL: ${repo_url}
      targetRevision: ${branch}
      path: ${manifests_path}
      directory:
        recurse: true
  destination:
    server: ${server}
    namespace: ${namespace}
