# Типовые ArgoCDProjectRole — встроены в чарт, доступны в каждом проекте
# без локального определения; локальная секция с тем же именем переопределяет
# встроенную (rules заменяются целиком), удалить встроенную нельзя.
argocdProjectRoles:
  viewer:
    description: Read-only приложений проекта
    rules:
      - resource: applications
        verbs: [get, list, watch]
        objects: ["*"]
  developer:
    description: Read-only внутри проекта (приложения + репозитории)
    rules:
      - resource: applications
        verbs: [get, list, watch]
        objects: ["*"]
      - resource: repositories
        verbs: [get]
        objects: ["*"]
  admin:
    description: Полный контроль приложений проекта
    rules:
      - resource: applications
        verbs: [get, list, watch, create, update, delete, sync, override]
        objects: ["*"]
      - resource: repositories
        verbs: ["*"]
        objects: ["*"]

