{{- if .Values.serviceAccounts }}
{{- range $name, $sa := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | quote }}
  namespace: {{ $sa.saNamespace | default "default" | quote }}
  labels:
    app.kubernetes.io/managed-by: argocd-render
    {{- with $sa.labels }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- with $sa.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- with $sa.imagePullSecrets }}
imagePullSecrets:
{{ toYaml . | indent 2 }}
{{- end }}
{{- if hasKey $sa "automountServiceAccountToken" }}
automountServiceAccountToken: {{ $sa.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- end }}
