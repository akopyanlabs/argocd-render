{{- /* subjectRoles normalizes the argocdRoles field (string or list) to a
       comma-separated string (include can only return strings; the consumer
       splits it back and drops empty entries). */ -}}
{{- define "argocdRBAC.subjectRoles" }}
{{- $roles := list }}
{{- if kindIs "string" . }}{{ $roles = list . }}
{{- else if kindIs "slice" . }}{{ $roles = . }}{{ end }}
{{- if $roles }}{{ join "," $roles }}{{ end }}
{{- end }}

{{- if or .Values.argocdProjectRoles .Values.argocdUserRoles }}
{{- /* ArgoCD RBAC (argocd-rbac-operator): kube-api RBAC and ArgoCD access
       are defined in one place — a group/user entry with `argocdRoles`.
       Groups get an ArgoCDProjectRole bound to THIS stage's AppProject
       (argocdStage = AppProject name, injected by argocd-render); users get
       a global ArgoCDRole (objects carry the project scope explicitly). */ -}}
{{- $ns := .Values.argocdNamespace | default "argocd-system" }}
{{- $stage := .Values.argocdStage | default "" }}
{{- $prfx := "" }}
{{- with $stage }}{{ $prfx = printf "%s-" . }}{{ end }}

{{- /* Groups → ArgoCDProjectRole, aggregated by role. */ -}}
{{- $groupsByRole := dict }}
{{- range $gname, $g := .Values.groups }}
{{- range $role := include "argocdRBAC.subjectRoles" $g.argocdRoles | splitList "," }}
{{- if $role }}
{{- $gl := list }}
{{- if hasKey $groupsByRole $role }}{{ $gl = index $groupsByRole $role }}{{ end }}
{{- $gl = append $gl $gname }}
{{- $_ := set $groupsByRole $role $gl }}
{{- end }}
{{- end }}
{{- end }}

{{- /* Users → ArgoCDRole, aggregated by role. */ -}}
{{- $usersByRole := dict }}
{{- range $uname, $u := .Values.users }}
{{- range $role := include "argocdRBAC.subjectRoles" $u.argocdRoles | splitList "," }}
{{- if $role }}
{{- $ul := list }}
{{- if hasKey $usersByRole $role }}{{ $ul = index $usersByRole $role }}{{ end }}
{{- $ul = append $ul $uname }}
{{- $_ := set $usersByRole $role $ul }}
{{- end }}
{{- end }}
{{- end }}

{{- /* Fail-closed: a referenced role must exist in the library — a typo'd
       name would silently grant nothing. */ -}}
{{- range $rname, $_ := $groupsByRole }}
{{- if not (hasKey $.Values.argocdProjectRoles $rname) }}
{{- fail (printf "groups reference undefined argocdProjectRole %q (defined: %v)" $rname (keys $.Values.argocdProjectRoles | sortAlpha | join ", ")) }}
{{- end }}
{{- end }}
{{- if $groupsByRole }}
{{- if not $stage }}
{{- fail "groups with argocdRoles require argocdStage (AppProject name) — render via argocd-render, it injects the stage automatically" }}
{{- end }}
{{- end }}
{{- range $rname, $_ := $usersByRole }}
{{- if not (hasKey $.Values.argocdUserRoles $rname) }}
{{- fail (printf "users reference undefined argocdUserRole %q (defined: %v)" $rname (keys $.Values.argocdUserRoles | sortAlpha | join ", ")) }}
{{- end }}
{{- end }}

{{- range $rname, $r := .Values.argocdProjectRoles }}
{{- if hasKey $groupsByRole $rname }}
{{- $gl := index $groupsByRole $rname }}
---
apiVersion: rbac-operator.argoproj-labs.io/v1alpha1
kind: ArgoCDProjectRole
metadata:
  name: {{ $prfx }}{{ $rname }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/managed-by: argocd-render
spec:
  description: {{ $r.description | default "" | quote }}
  rules:
{{ toYaml $r.rules | indent 2 }}
---
apiVersion: rbac-operator.argoproj-labs.io/v1alpha1
kind: ArgoCDProjectRoleBinding
metadata:
  name: {{ $prfx }}{{ $rname }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/managed-by: argocd-render
spec:
  argocdProjectRoleRef:
    name: {{ $prfx }}{{ $rname }}
  subjects:
    - appProjectRef: {{ $stage | quote }}
      groups:
{{ toYaml $gl | indent 6 }}
{{- end }}
{{- end }}

{{- range $rname, $r := .Values.argocdUserRoles }}
{{- if hasKey $usersByRole $rname }}
{{- $ul := index $usersByRole $rname }}
---
apiVersion: rbac-operator.argoproj-labs.io/v1alpha1
kind: ArgoCDRole
metadata:
  name: {{ $prfx }}{{ $rname }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/managed-by: argocd-render
spec:
  rules:
{{ toYaml $r.rules | indent 2 }}
---
apiVersion: rbac-operator.argoproj-labs.io/v1alpha1
kind: ArgoCDRoleBinding
metadata:
  name: {{ $prfx }}{{ $rname }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/managed-by: argocd-render
spec:
  argocdRoleRef:
    name: {{ $prfx }}{{ $rname }}
  subjects:
{{- range $ul }}
    - kind: sso
      name: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
